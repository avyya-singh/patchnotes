name: Verify and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PATCHNOTES_DATA: /tmp/patchnotes-test
      - run: python evaluate.py
        env:
          PATCHNOTES_DATA: /tmp/patchnotes-eval
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm test && npm run build:demo
        working-directory: frontend
      - run: docker build -t patchnotes:ci .
      - run: |
          docker run -d --name patchnotes-test -p 8000:8000 patchnotes:ci
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs patchnotes-test
          exit 1
